[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zkfol"
version = "0.1.3"
description = "Reference implementation of the zkFOL arithmetisation pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["sympy>=1.12"]
authors = [{name = "zkFOL reference implementation"}]

[project.scripts]
zkfol = "zkfol.cli:main"
zkfol-examples = "zkfol.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
