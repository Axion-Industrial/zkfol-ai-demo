<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" font-family="sans-serif">
  <rect width="920" height="500" fill="#ffffff"/>
  <text x="460" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Fibonacci in FOL-Zinc: one statement, every formulation</text>
  <text x="460" y="41" text-anchor="middle" font-size="11" fill="#666">measured 2026-07-04, Ryzen 5700X, single core, Zinc rev 0c9ed21, 256-bit sampled prime</text>

  <!-- ================= Panel 1: rows vs n, log-log ================= -->
  <text x="240" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Constraint rows vs n</text>

  <g stroke="#e6e6e6" stroke-width="1">
    <line x1="60" y1="400" x2="420" y2="400"/><line x1="60" y1="360" x2="420" y2="360"/>
    <line x1="60" y1="320" x2="420" y2="320"/><line x1="60" y1="280" x2="420" y2="280"/>
    <line x1="60" y1="240" x2="420" y2="240"/><line x1="60" y1="200" x2="420" y2="200"/>
    <line x1="60" y1="160" x2="420" y2="160"/><line x1="60" y1="120" x2="420" y2="120"/>
    <line x1="60" y1="80"  x2="420" y2="80"/>
    <line x1="81"  y1="80" x2="81"  y2="400"/><line x1="187" y1="80" x2="187" y2="400"/>
    <line x1="293" y1="80" x2="293" y2="400"/><line x1="399" y1="80" x2="399" y2="400"/>
  </g>
  <g font-size="10" fill="#666">
    <text x="55" y="404" text-anchor="end">10</text><text x="55" y="364" text-anchor="end">100</text>
    <text x="55" y="324" text-anchor="end">1k</text><text x="55" y="284" text-anchor="end">10k</text>
    <text x="55" y="244" text-anchor="end">100k</text><text x="55" y="204" text-anchor="end">1M</text>
    <text x="55" y="164" text-anchor="end">10M</text><text x="55" y="124" text-anchor="end">100M</text>
    <text x="55" y="84" text-anchor="end">1G</text>
    <text x="81" y="416" text-anchor="middle">10</text><text x="187" y="416" text-anchor="middle">100</text>
    <text x="293" y="416" text-anchor="middle">1,000</text><text x="399" y="416" text-anchor="middle">10,000</text>
    <text x="240" y="432" text-anchor="middle" font-size="11" fill="#333">n</text>
  </g>

  <!-- generic route: measured 8/16/32 (y = 400 - (log10(rows)-1)*40), dashed extrapolation -->
  <polyline points="71,332 103,310 135,287" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <polyline points="135,287 399,86" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,5" opacity="0.7"/>
  <circle cx="71" cy="332" r="4" fill="#c0392b"/><circle cx="103" cy="310" r="4" fill="#c0392b"/><circle cx="135" cy="287" r="4" fill="#c0392b"/>
  <text x="66" y="349" font-size="9" fill="#96625c">n=8: Zinc pad() bug</text>

  <!-- direct compact: 32/100/1000/10000 -->
  <polyline points="135,379 187,360 293,320 399,280" fill="none" stroke="#7f8c8d" stroke-width="2.5"/>
  <circle cx="135" cy="379" r="4" fill="#7f8c8d"/><circle cx="187" cy="360" r="4" fill="#7f8c8d"/>
  <circle cx="293" cy="320" r="4" fill="#7f8c8d"/><circle cx="399" cy="280" r="4" fill="#7f8c8d"/>

  <!-- fast doubling: 32/1000/10000 -->
  <polyline points="135,392 293,382 399,376" fill="none" stroke="#2980b9" stroke-width="2.5"/>
  <circle cx="135" cy="392" r="4" fill="#2980b9"/><circle cx="293" cy="382" r="4" fill="#2980b9"/>
  <circle cx="399" cy="376" r="5" fill="#2980b9" stroke="#1a5276" stroke-width="2"/>

  <!-- legend, top-left inside panel -->
  <g font-size="11">
    <rect x="70" y="90" width="240" height="62" fill="#ffffff" stroke="#dddddd"/>
    <line x1="78" y1="103" x2="102" y2="103" stroke="#c0392b" stroke-width="2.5"/>
    <text x="108" y="107" fill="#333">generic mkQ bridge: ~7 n^2 rows</text>
    <line x1="78" y1="121" x2="102" y2="121" stroke="#7f8c8d" stroke-width="2.5"/>
    <text x="108" y="125" fill="#333">direct trace (hand): ~n rows</text>
    <line x1="78" y1="139" x2="102" y2="139" stroke="#2980b9" stroke-width="2.5"/>
    <text x="108" y="143" fill="#333">fast doubling: ~3 log n rows</text>
  </g>
  <text x="70" y="168" font-size="10" fill="#c0392b">dashed: extrapolation, ~7e8 rows at n=10,000</text>
  <text x="70" y="182" font-size="10" fill="#1a5276">ringed point: compiled from the FOL predicate</text>

  <!-- ================= Panel 2: wall clock at n=10000 ================= -->
  <text x="680" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">End-to-end wall clock at n = 10,000 (prove + verify)</text>

  <g stroke="#e6e6e6" stroke-width="1">
    <line x1="480" y1="400" x2="880" y2="400"/><line x1="480" y1="336" x2="880" y2="336"/>
    <line x1="480" y1="272" x2="880" y2="272"/><line x1="480" y1="208" x2="880" y2="208"/>
    <line x1="480" y1="144" x2="880" y2="144"/><line x1="480" y1="80" x2="880" y2="80"/>
  </g>
  <g font-size="10" fill="#666">
    <text x="475" y="404" text-anchor="end">0.01 s</text><text x="475" y="340" text-anchor="end">0.1 s</text>
    <text x="475" y="276" text-anchor="end">1 s</text><text x="475" y="212" text-anchor="end">10 s</text>
    <text x="475" y="148" text-anchor="end">100 s</text><text x="475" y="84" text-anchor="end">1000 s</text>
  </g>

  <!-- RISC Zero reference lines: y = 400 - (log10(s)+2)*64 -->
  <line x1="480" y1="257" x2="880" y2="257" stroke="#b03a2e" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="876" y="252" text-anchor="end" font-size="10" fill="#b03a2e">RISC Zero 1.7 s, RTX A6000 GPU (prove-only)</text>
  <line x1="480" y1="206" x2="880" y2="206" stroke="#b03a2e" stroke-width="1.5" stroke-dasharray="2,4"/>
  <text x="876" y="200" text-anchor="end" font-size="10" fill="#b03a2e">RISC Zero 10.8 s, 64-core EPYC (prove-only)</text>

  <!-- bars: baseline y=400 -->
  <rect x="497" y="118" width="62" height="282" fill="#7f8c8d" opacity="0.85"/>
  <text x="528" y="110" text-anchor="middle" font-size="11" fill="#333">257 s</text>
  <rect x="592" y="206" width="62" height="194" fill="#2980b9" opacity="0.9"/>
  <text x="623" y="198" text-anchor="middle" font-size="11" fill="#333">10.7 s</text>
  <rect x="687" y="276" width="62" height="124" fill="#27ae60" opacity="0.9"/>
  <text x="718" y="268" text-anchor="middle" font-size="11" fill="#333">0.86 s</text>
  <rect x="782" y="370" width="62" height="30" fill="#8e44ad" opacity="0.9"/>
  <text x="813" y="362" text-anchor="middle" font-size="11" fill="#333">30 ms</text>

  <g font-size="10" fill="#333">
    <text x="528" y="442" text-anchor="middle">direct trace</text>
    <text x="528" y="454" text-anchor="middle">exact F_10000</text>
    <text x="528" y="466" text-anchor="middle" fill="#888">proof 526 MiB</text>
    <text x="623" y="442" text-anchor="middle">fast doubling</text>
    <text x="623" y="454" text-anchor="middle">exact F_10000</text>
    <text x="623" y="466" text-anchor="middle" fill="#888">proof 31.5 MiB</text>
    <text x="718" y="442" text-anchor="middle">+ CRT channels</text>
    <text x="718" y="454" text-anchor="middle">exact F_10000</text>
    <text x="718" y="466" text-anchor="middle" fill="#888">proof 15.9 MiB</text>
    <text x="813" y="442" text-anchor="middle">mod 2^64 channel</text>
    <text x="813" y="454" text-anchor="middle">(RISC0's statement)</text>
    <text x="813" y="466" text-anchor="middle" fill="#888">proof 1.2 MiB</text>
  </g>

  <text x="484" y="76" font-size="10" fill="#c0392b">generic route at n=10,000: refused (~7e8 rows)</text>

  <text x="460" y="486" text-anchor="middle" font-size="10" fill="#777">Bars include verification on one CPU core; RISC Zero references are prove-only published numbers for the weaker mod-2^64 statement.</text>
  <text x="460" y="498" text-anchor="middle" font-size="10" fill="#777">Research prototype: Zinc's Fiat-Shamir analysis is pending upstream. Morning state: every bar was impossible (768 GiB refusal).</text>
</svg>
