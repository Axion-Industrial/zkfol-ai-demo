[package]
name = "zkfol-zinc-runner"
version = "0.5.14"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-bigint = "0.4"
num-traits = "0.2"
zinc = { git = "https://github.com/NethermindEth/zinc.git", rev = "0c9ed214" }

[features]
default = []
parallel = ["zinc/parallel"]
