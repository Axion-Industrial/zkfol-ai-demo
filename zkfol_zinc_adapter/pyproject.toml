[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zkfol-zinc-adapter"
version = "0.6.0"
description = "Expositional adapter from the zkFOL reference implementation to Zinc-compatible integer CCS/R1CS JSON"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["sympy>=1.12"]
authors = [{name = "zkFOL Zinc adapter"}]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
zkfol-zinc-export = "zkfol_zinc_adapter.export:main"
zkfol-zinc-explain = "zkfol_zinc_adapter.explain:main"
zkfol-zinc-bench = "zkfol_zinc_adapter.bench:main"
zkfol-zinc-check = "zkfol_zinc_adapter.check:main"
zkfol-zinc-inspect = "zkfol_zinc_adapter.view:main"
zkfol-zinc = "zkfol_zinc_adapter.cli:main"
folzinc = "zkfol_zinc_adapter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
